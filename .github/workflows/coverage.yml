name: Coverage

# CNB main 推送会同步到本仓库的 GitHub 镜像，覆盖率随 push 更新；
# pull_request 场景由 Codecov 给出 diff 覆盖。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支/PR 的旧运行自动取消，避免重复上报造成徽章抖动
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  coverage:
    name: 单元测试与覆盖率 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 与 unit-test.yml 的 Python 矩阵保持一致；fail-fast: false 让每个版本都给出结论。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # 与仓库其余工作流一致：内联 harden-runner，审计出网调用，记录但不阻断。
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 只有测试工具；aiohttp/httpx 等运行依赖在
          # requirements.txt。tests/conftest.py 会导入它们，必须一起安装。
          # AstrBot 宿主不安装，由 conftest 注入最小桩。
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试并统计覆盖率
        env:
          # 覆盖率数据文件放到临时目录，避免污染工作区
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m tests.run_coverage

      # 仅矩阵首个版本上报，避免多版本互覆盖导致徽章抖动；无 token 时安全跳过。
      - name: 上报覆盖率到 Codecov
        if: ${{ always() && matrix.python-version == '3.12' && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-3.12
          fail_ci_if_error: false
          verbose: true

      - name: 上传覆盖率报告工件
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
