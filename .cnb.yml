$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 64
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 克隆Astrbot并重新克隆
                script:
                  - git clone https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot-tmp
                  - cp -r /tmp/astrbot-tmp/astrbot /workspace
                  - rm -rf /tmp/astrbot-tmp
                  - git clone https://github.com/AstrBotDevs/AstrBot.git
main:
      # CNB 主仓是源，PR 分支不会同步到 GitHub 镜像，PR 门禁必须在 CNB 侧跑。
      # 这里跑最小检查集（代码规范 + 单测覆盖率上报）；3.12-3.15 矩阵与
      # Codecov 上报仍由 GitHub Actions 负责，push 到 main 只做镜像同步。
      pull_request:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          runner:
            cpus: 4
          stages:
            - name: 安装依赖
              # CNB 会把 script 数组用 && 拼接，多行内容必须放在同一个块里。
              script:
                    - |
                      set -e
                      pip install --upgrade pip
                      pip install -r requirements.txt -r requirements-dev.txt
            - name: 代码规范检查
              script:
                    - |
                      set -e
                      # 默认镜像的 virtualenv 轮子会 403，改走官方源安装。
                      pip install --index-url https://pypi.org/simple "pre-commit==4.7.0"
                      python -m pre_commit run --all-files || python -m pre_commit run --all-files
            - name: 单元测试与覆盖率
              # 先建 AstrBot 桩再开 coverage，口径与 tests/run_coverage.py 一致。
              script:
                    - |
                      set -e
                      python -m tests.run_coverage
                      # testing:coverage 不支持 coverage.py 的 XML，改由 lcov 上报。
                      coverage lcov -o lcov.info
                      # 零语句文件（如 __init__.py）的记录不带 LF，会导致汇总 NaN；
                      # 只保留含 LF 的记录。
                      awk 'BEGIN { RS="end_of_record"; ORS="end_of_record\n" } /LF:/ { print }' lcov.info > lcov.filtered.info
                      mv lcov.filtered.info lcov.info
            - name: 上报单测覆盖率
              type: testing:coverage
              options:
                    pattern: lcov.info
                    # 报告缺失说明上游步骤没产出，直接失败，避免「静默不上报」。
                    breakIfNoCoverage: true
      # push 到 main：只把代码同步到 GitHub 镜像仓库。
      # 单测覆盖率、Release 与插件 zip 打包统一由 GitHub Actions 产出。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_treasure_bag.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}
