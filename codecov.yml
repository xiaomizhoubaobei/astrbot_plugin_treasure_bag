# Codecov 配置：覆盖率报告口径与门禁策略
# 说明：本项目覆盖率由 .github/workflows/coverage.yml 产出 coverage.xml 后上报，
#       CNB 侧的测试与覆盖率上报（testing:coverage）已移除，Codecov 为唯一覆盖率来源。

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # 项目整体覆盖率：允许小幅波动，避免无关改动的 PR 被卡
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # 本次变更的增量覆盖率：新增代码应当带测试
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

# 覆盖率构成（供 Codecov 页面展开查看）
# 本仓库不存在 src/ 目录，源码位于 handlers/、baidu/、utils/ 及根目录的
# main.py、build_release.py。paths 必须匹配 coverage.xml 里的真实文件路径，
# 否则带 --flag unittests 的上传会匹配不到任何文件而被 Codecov 判为格式错误。
flags:
  unittests:
    paths:
      - handlers/
      - baidu/
      - utils/
      - main.py
      - build_release.py
    carryforward: true

# 忽略非业务代码，避免拉低口径
ignore:
  - "tests/"
  - "docs/"
  - "install_gpg_keys.sh"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
